<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GestorResi - Inicio</title>
    <!-- Tailwind CSS por CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Hoja de estilos global profesional -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center items-center p-6">

    <div class="max-w-md w-full text-center space-y-8 bg-white p-8 rounded-2xl border border-slate-200 shadow-xl card-premium">
        <div>
            <!-- Icono/Texto con el color azul sanitario característico -->
            <h1 class="text-3xl font-extrabold text-sky-600 font-mono tracking-wider">🏢 GESTOR RESI</h1>
            <p class="text-xs text-slate-500 mt-2">Panel de Control y Gestión Asistencial</p>
        </div>


        <div class="flex flex-col gap-4">
            <!-- Botón de Iniciar Sesión -->
            <a href="login.html"
                class="w-full py-4 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl transition text-center shadow-md uppercase tracking-wide text-xs btn-primary flex justify-center items-center">
                Iniciar Sesión
            </a>

            <!-- Botón de Registrar Residencia -->
            <a href="registro-residencia.html"
                class="w-full py-4 bg-white hover:bg-slate-50 text-sky-700 font-bold rounded-xl border-2 border-sky-600 transition text-center shadow-sm uppercase tracking-wide text-xs btn-secondary flex justify-center items-center">
                Registrar Residencia
            </a>
        </div>

        <div class="text-[10px] text-slate-400 font-mono">
            Backend Architecture System v1.0
        </div>
    </div>

    <!-- Modal / Alerta Flotante Cerrable -->
    <div id="demoModal"
        class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50 transition-opacity duration-300">
        <div
            class="bg-white rounded-2xl border border-slate-200 shadow-2xl max-w-sm w-full p-6 text-center relative animate-bounce-short">
            <!-- Botón X para cerrar -->
            <button onclick="cerrarAlertaDemo()"
                class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 text-xl font-bold w-8 h-8 flex items-center justify-center rounded-full hover:bg-slate-100 transition">
                &times;
            </button>

            <div
                class="w-12 h-12 bg-sky-100 text-sky-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                🚀
            </div>

            <h3 class="text-lg font-bold text-slate-800 mb-1">Modo Demostración</h3>
            <p class="text-xs text-slate-500 mb-4">
                Puedes explorar la plataforma sin necesidad de registrarte con las credenciales demo:
            </p>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200 text-left font-mono text-xs space-y-2 mb-5">
                <div class="flex justify-between items-center">
                    <span class="text-slate-500">Usuario:</span>
                    <span
                        class="font-bold text-sky-700 bg-white px-2 py-1 rounded border border-slate-200">adminDemo</span>
                </div>
                <div class="flex justify-between items-center">
                    <span class="text-slate-500">Contraseña:</span>
                    <span
                        class="font-bold text-sky-700 bg-white px-2 py-1 rounded border border-slate-200">admin123</span>
                </div>
            </div>

            <button onclick="cerrarAlertaDemo()"
                class="w-full py-2.5 bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-xl text-xs transition shadow-sm">
                Entendido
            </button>
        </div>
    </div>

    <!-- Script de control -->
    <script>
        function cerrarAlertaDemo() {
            const modal = document.getElementById('demoModal');
            modal.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => modal.remove(), 300);
        }
    </script>

</body>

</html>
